<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>근무표</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1c2430;--mu:#6b7686;--bd:#dde2e9;--ac:#2563eb;--wk:#dbeafe;--wkt:#1e40af;--yl:#fef08a;--ylt:#854d0e;--pu:#e9d5ff;--put:#6b21a8;--or:#fed7aa;--ort:#9a3412;--gr:#bbf7d0;--grt:#166534;--ok:#15803d;--bad:#b91c1c;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12161c;--card:#1b212a;--tx:#e8ecf2;--mu:#98a2b3;--bd:#2c3542;--ac:#60a5fa;--wk:#1e3a6e;--wkt:#bfdbfe;--yl:#5c4a0a;--ylt:#fde68a;--pu:#4a2a6e;--put:#e9d5ff;--or:#6b3410;--ort:#fed7aa;--gr:#14532d;--grt:#bbf7d0;--ok:#4ade80;--bad:#f87171;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12161c;--card:#1b212a;--tx:#e8ecf2;--mu:#98a2b3;--bd:#2c3542;--ac:#60a5fa;--wk:#1e3a6e;--wkt:#bfdbfe;--yl:#5c4a0a;--ylt:#fde68a;--pu:#4a2a6e;--put:#e9d5ff;--or:#6b3410;--ort:#fed7aa;--gr:#14532d;--grt:#bbf7d0;--ok:#4ade80;--bad:#f87171;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;line-height:1.5}
main{max-width:900px;margin:0 auto;padding:20px 12px 40px}
h1{font-size:22px;margin:0 0 4px}.sub{color:var(--mu);font-size:14px;margin:0 0 16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:14px}
h2{font-size:15px;margin:0 0 10px}
input,select,button{font:inherit;color:var(--tx)}
#q{width:100%;padding:12px 14px;font-size:17px;border:1px solid var(--bd);border-radius:10px;background:var(--bg)}
input:focus,select:focus{outline:2px solid var(--ac)}
.who{font-size:18px;font-weight:700;margin:12px 0 6px}.who small,.chip small{font-weight:400;color:var(--mu);font-size:12px}
.row{display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin:6px 0}.lab{width:46px;font-size:13px;color:var(--mu)}
.chip{padding:4px 10px;border-radius:999px;font-weight:600;font-size:13px}
.chip.w{background:var(--wk);color:var(--wkt)}.chip.y{background:var(--yl);color:var(--ylt)}.chip.p{background:var(--pu);color:var(--put)}.chip.r{background:var(--or);color:var(--ort)}
.chip.w small{color:inherit;opacity:.8}
.ok{color:var(--ok)}.bad{color:var(--bad);font-weight:700}.wkl{font-size:13px;margin:2px 0}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px;padding-bottom:2px}.tabs button{white-space:nowrap}
button{padding:8px 13px;border:1px solid var(--bd);border-radius:9px;background:var(--card);cursor:pointer}
.tabs .on,button.p{background:var(--ac);border-color:var(--ac);color:#fff}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.bar input,.srow input{padding:7px 9px;border:1px solid var(--bd);border-radius:8px;background:var(--bg)}
.scroll{overflow:auto;max-height:72vh;border:1px solid var(--bd);border-radius:8px}
table{border-collapse:separate;border-spacing:0;width:100%;min-width:560px;font-size:13px}
th,td{border-right:1px solid var(--bd);border-bottom:1px solid var(--bd);padding:0;text-align:center;background:var(--card)}
thead th{position:sticky;top:0;z-index:2;padding:6px 4px;background:var(--bg)}
.dt{position:sticky;left:0;z-index:1;width:54px;padding:4px;font-weight:600;background:var(--bg)}
thead .dt{z-index:3}.dt small{display:block;font-weight:400;color:var(--mu);font-size:11px}
.dt.sun{background:var(--gr);color:var(--grt)}.dt.sun small{color:inherit}
th input,th select{width:100%;margin:1px 0;padding:4px;border:1px solid var(--bd);border-radius:6px;background:var(--card);text-align:center;font-size:13px}
th input.pn{font-weight:700;font-size:14px}
td input{cursor:pointer;width:100%;border:0;padding:8px 4px;background:transparent;text-align:center;font-size:13px}
td input:focus{outline:2px solid var(--ac);outline-offset:-2px}
td.s0{background:var(--yl)}td.s1{background:var(--pu)}td.s2{background:var(--or)}td.w{background:var(--wk)}
tfoot td{padding:6px;background:var(--bg);color:var(--mu);font-size:12px}
.srow{display:grid;grid-template-columns:1fr 1fr 1.5fr 1.1fr auto;gap:5px;margin-bottom:6px}.srow input{width:100%;min-width:0;font-size:13px;padding:7px 5px}.sh{font-size:12px;color:var(--mu);margin-bottom:2px}.srow select{width:100%;min-width:0;font-size:13px;padding:7px 3px;border:1px solid var(--bd);border-radius:8px;background:var(--bg)}
[hidden]{display:none!important}#pk{position:fixed;inset:0;z-index:50}.pkb{position:fixed;background:var(--card);border:1px solid var(--bd);box-shadow:0 8px 24px rgba(0,0,0,.25);width:min(300px,calc(100vw - 16px));max-height:60vh;border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px}#pkl button{padding:5px 9px;font-size:13px}.pks button{flex:1;padding:6px}.pkh{display:flex;justify-content:space-between;align-items:center}.pks{display:flex;gap:6px}#pki{padding:10px;font-size:16px;border:1px solid var(--bd);border-radius:9px;background:var(--bg)}#pkl{overflow:auto;display:flex;flex-wrap:wrap;gap:6px;align-content:flex-start;min-height:60px;flex:1}.home{display:grid;gap:12px;margin-top:24px}.home button{padding:28px;font-size:22px;font-weight:700;border-radius:16px}.top{display:flex;gap:10px;align-items:center;margin-bottom:4px}.top h1{margin:0}.note{font-size:12.5px;color:var(--mu);margin-top:8px}
</style></head><body><main>
<div id="home"><h1>근무표</h1><p class="sub">지역을 선택해 주세요.</p><div class="home"><button data-r="광명">광명</button><button data-r="안양">안양</button><button data-r="원주">원주</button></div></div>
<div id="app" hidden><div class="top"><button data-home="1">← 지역</button><h1 id="rt">근무표</h1></div><p class="sub">이름을 입력하면 이번 달 근무일과 휴무일을 바로 확인할 수 있어요.</p>
<div class="card"><input id="q" type="search" placeholder="이름 입력" autocomplete="off"><div id="res"></div></div>
<div class="tabs" id="tabs"></div>
<div class="card" id="sheet"></div>
<div class="card" id="stores"></div>
<datalist id="dl"></datalist></div>
<div id="pk" hidden><div class="pkb"><div class="pkh"><b id="pkt"></b><button data-pkx="1">닫기</button></div><div class="pks"><button data-pv="휴무">휴무</button><button data-pv="휴가">휴가</button><button data-pv="비번">비번</button><button data-pv="__clr">비우기</button></div><input id="pki" placeholder="검색 또는 직접 입력" autocomplete="off"><div id="pkl"></div><button class="p" data-pkok="1">입력한 값으로 저장</button></div></div>
</main>
<script>
var D=['월','화','수','목','금','토','일'],ST=['휴무','휴가','비번'],MAX=52,KEY='';
var SN=['영월','횡성','횡성축협','삼익','단관','시청','단계','관설','기업3차'],SS=['김병구','김효정','오명애','최별','정혜인','황순민','황시현','김소연','최현정'];
function clone(o){return JSON.parse(JSON.stringify(o))}
function pad(n){return String(n).padStart(2,'0')}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function ls(){try{var s=localStorage.getItem(KEY);return s?JSON.parse(s):null}catch(e){return null}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function parts(ym){var a=ym.split('-');return [+a[0],+a[1]]}
function ttl(ym){var a=parts(ym);return String(a[0]).slice(2)+'.'+a[1]+'월'}
function dim(ym){var a=parts(ym);return new Date(a[0],a[1],0).getDate()}
function dt(ym,d){var a=parts(ym);return new Date(a[0],a[1]-1,d)}
function wd(ym,d){return (dt(ym,d).getDay()+6)%7}
function wlab(ym,d){var s=dt(ym,d);s.setDate(s.getDate()-wd(ym,d));var e=new Date(s);e.setDate(e.getDate()+6);return (s.getMonth()+1)+'/'+s.getDate()+'~'+(e.getMonth()+1)+'/'+e.getDate()}
function pattern(P){var cnt=[0,0,0,0,0,0,0],r=P.map(function(){return []});
 P.map(function(p,i){return i}).sort(function(a,b){return P[b].h-P[a].h}).forEach(function(i,pi){
  var need=7-Math.min(7,Math.floor(MAX/P[i].h));
  for(var k=0;k<need;k++){var b=-1;for(var d=0;d<7;d++){if(r[i].indexOf(d)>-1)continue;if(b<0||cnt[d]<cnt[b]||(cnt[d]===cnt[b]&&((d+pi*2)%7<(b+pi*2)%7)))b=d}r[i].push(b);cnt[b]++}});
 return r}
function auto(sh){var r=pattern(sh.people),n=dim(sh.ym);
 sh.people.forEach(function(p,i){for(var d=1;d<=n;d++){var k=i+'-'+d,c=sh.cells[k]||'';if(c==='휴무')c='';if(!c&&r[i].indexOf(wd(sh.ym,d))>-1)c='휴무';if(c)sh.cells[k]=c;else delete sh.cells[k]}})}
function init(){var s=ls();if(s&&s.sheets&&s.sheets.length)return s;var n=new Date(),sh={ym:n.getFullYear()+'-'+pad(n.getMonth()+1),people:(KEY.slice(-2)==='원주'?['이종효','정다영','원봉희','김아름']:['','','','']).map(function(x,i){return {name:x,job:'',h:i<2?8:9}}),cells:{}};auto(sh);
 return {cur:0,sheets:[sh],stores:KEY.slice(-2)==='원주'?SN.map(function(x,i){return {n:x,s:SS[i],d:''}}):[]}}
var S=null;
function cur(){return S.sheets[S.cur]}
function sti(v){for(var k=0;k<3;k++)if(v.indexOf(ST[k])===0)return k;return -1}
function cls(v){var k=sti(v);return k>-1?'s'+k:(v?'w':'')}
function stat(sh,i){var n=dim(sh.ym),o={w:[],e:0,0:[],1:[],2:[]};for(var d=1;d<=n;d++){var v=sh.cells[i+'-'+d]||'',k=sti(v);if(!v)o.e++;else if(k>-1)o[k].push(d);else o.w.push(d)}return o}
function Q(){return document.getElementById('q').value.trim().toLowerCase()}
function render(){tabs();sheet();stores();dl();result()}
function tabs(){document.getElementById('tabs').innerHTML=S.sheets.map(function(s,i){return '<button data-tab="'+i+'" class="'+(i===S.cur?'on':'')+'">'+ttl(s.ym)+'</button>'}).join('')+'<button class="p" data-add="1">+ 표 추가</button>'}
function sheet(){var sh=cur(),n=dim(sh.ym),h='<div class="bar"><input type="month" data-ym="1" value="'+sh.ym+'"><button class="p" data-fill="1">자동 배정</button><button data-auto="1">휴무만 자동 배정</button>'+(S.sheets.length>1?'<button data-del="1">이 표 삭제</button>':'')+'</div>'+(AM?'<div class="note" style="margin:0 0 8px">'+esc(AM)+'</div>':'')+'<div class="scroll"><table><thead><tr><th class="dt">일</th>';
 sh.people.forEach(function(p,i){h+='<th><input class="pn" data-pn="'+i+'" value="'+esc(p.name)+'" placeholder="이름" maxlength="8"></th>'});
 h+='</tr></thead><tbody>';
 for(var d=1;d<=n;d++){var w=wd(sh.ym,d);h+='<tr><td class="dt'+(w===6?' sun':'')+'">'+d+'<small>'+D[w]+'</small></td>';
  for(var i=0;i<sh.people.length;i++){var v=sh.cells[i+'-'+d]||'';h+='<td class="'+cls(v)+'"><input readonly data-i="'+i+'" data-d="'+d+'" value="'+esc(v)+'"></td>'}
  h+='</tr>'}
 h+='</tbody><tfoot id="ft"></tfoot></table></div><p class="note">칸에 매장명을 쓰거나 목록에서 고르세요. 휴무(노랑)·휴가(보라)·비번(주황)은 색으로 표시돼요. 일요일은 초록색이에요.</p>'+summary(sh);
 document.getElementById('sheet').innerHTML=h;foot()}
function foot(){var sh=cur(),el=document.getElementById('ft');if(!el)return;el.innerHTML='<tr><td class="dt">근무</td>'+sh.people.map(function(p,i){return '<td>'+stat(sh,i).w.length+'일</td>'}).join('')+'</tr>'}
function uniq(a){var o={},r=[];a.forEach(function(x){x=(x||'').trim();if(x&&!o[x]){o[x]=1;r.push(x)}});return r.sort(function(a,b){return a.localeCompare(b,'ko')})}
function cellsAll(){var a=[];S.sheets.forEach(function(sh){Object.keys(sh.cells).forEach(function(k){a.push(sh.cells[k])})});return a}
function NM(){S.master=S.master||[];S.stores.forEach(function(s){if(s.n&&S.master.indexOf(s.n)<0)S.master.push(s.n)});return S.master}
function WH(){var a=S.stores.map(function(s){return s.s});S.sheets.forEach(function(sh){sh.people.forEach(function(p){a.push(p.name)})});cellsAll().forEach(function(v){var m=v.match(/\(([^)]+)\)/g);if(m)m.forEach(function(x){a.push(x.slice(1,-1))})});return uniq(a)}
function op(list,c){var l=c&&list.indexOf(c)<0?list.concat([c]):list;return '<option value="">선택</option>'+l.map(function(x){return '<option'+(x===c?' selected':'')+' value="'+esc(x)+'">'+esc(x)+'</option>'}).join('')+'<option value="__new">직접 입력…</option>'}
function stores(){document.getElementById('stores').innerHTML='<h2>매장 목록 · SPC 점검일</h2><div class="bar"><input id="mn" placeholder="매장명 추가 (쉼표로 여러 개)"><button data-madd="1">목록에 추가</button></div><div class="srow sh"><span>매장명</span><span>담당</span><span>점검일 (눌러서 변경)</span><span>비고</span><span></span></div>'+S.stores.map(function(s,i){return '<div class="srow"><select data-sn="'+i+'">'+op(NM(),s.n)+'</select><select data-ss="'+i+'">'+op(WH(),s.s)+'</select><input type="date" data-sd="'+i+'" value="'+esc(s.d)+'"><input data-sm="'+i+'" value="'+esc(s.m||'')+'" placeholder="비고"><button data-sx="'+i+'">×</button></div>'}).join('')+'<button data-sadd="1">+ 매장 추가</button>'}
function dl(){document.getElementById('dl').innerHTML=ST.concat(S.stores.map(function(s){return s.n}).filter(Boolean)).map(function(v){return '<option value="'+esc(v)+'">'}).join('')}
function result(){var q=Q(),el=document.getElementById('res');if(!q){el.innerHTML='';return}
 var sh=cur(),m=[];sh.people.forEach(function(p,i){if(p.name.toLowerCase()===q)m.push(i)});
 if(!m.length)sh.people.forEach(function(p,i){if(p.name.toLowerCase().indexOf(q)>-1)m.push(i)});
 if(!m.length){el.innerHTML='<div class="note">'+esc(q)+' 님을 찾을 수 없어요.</div>';return}
 el.innerHTML=m.map(function(i){var p=sh.people[i],o=stat(sh,i),wk={};
  o.w.forEach(function(d){var l=wlab(sh.ym,d);wk[l]=(wk[l]||0)+p.h});
  function ch(a,c){return a.length?a.map(function(d){return '<span class="chip '+c+'">'+d+'일</span>'}).join(''):'-'}
  var wh=o.w.map(function(d){return '<span class="chip w">'+d+'일 <small>'+esc(sh.cells[i+'-'+d])+'</small></span>'}).join('')||'-';
  var weeks=Object.keys(wk).map(function(l){var bad=wk[l]>MAX;return '<div class="wkl">'+l+' · <b class="'+(bad?'bad':'ok')+'">'+wk[l]+'시간</b>'+(bad?' (52시간 초과!)':'')+'</div>'}).join('');
  return '<div class="who">'+esc(p.name)+' <small>· '+ttl(sh.ym)+'</small></div>'
   +'<div class="row"><span class="lab">근무일</span>'+wh+'</div>'
   +'<div class="row"><span class="lab">휴무일</span>'+ch(o[0],'y')+'</div>'
   +'<div class="row"><span class="lab">휴가</span>'+ch(o[1],'p')+'</div>'
   +'<div class="row"><span class="lab">비번</span>'+ch(o[2],'r')+'</div>'
   +'<div class="note">근무 '+o.w.length+'일 · 미배정 '+o.e+'일</div>'+weeks}).join('<hr style="border:0;border-top:1px solid var(--bd);margin:14px 0">')}
var AM='';
function base(v){return v.split(/[,\-]/)[0].trim().replace(/\d+$/,'')}
function stats(ref){var st={};ref.forEach(function(sh){var n=dim(sh.ym);sh.people.forEach(function(p,i){if(!p.name)return;var s=st[p.name]=st[p.name]||{n:0,r0:0,r2:0,wk:{},wa:{},nb:{},rw:[0,0,0,0,0,0,0]};
 for(var d=1;d<=n;d++){var v=sh.cells[i+'-'+d]||'';if(!v)continue;var w=wd(sh.ym,d),k=sti(v);s.n++;
  if(k===0){s.r0++;s.rw[w]++}else if(k===2)s.r2++;else if(k<0){var f=v.split(/[,\-]/)[0].trim(),b=base(v);s.wk[b]=(s.wk[b]||0)+1;s.wa[b]=s.wa[b]||[0,0,0,0,0,0,0];s.wa[b][w]++;if(/\d+$/.test(f))s.nb[b]=1}}})});return st}
function fillAuto(sh){var ref=S.sheets.filter(function(s){return s!==sh&&Object.keys(s.cells).length});if(!ref.length)ref=[sh];
 var st=stats(ref),n=dim(sh.ym),cnt=[],f=0,skip=[],z;for(z=0;z<=n;z++)cnt[z]=0;
 sh.people.forEach(function(p,i){for(var d=1;d<=n;d++)if(sti(sh.cells[i+'-'+d]||'')>-1)cnt[d]++});
 sh.people.map(function(p,i){return i}).sort(function(a,b){return sh.people[b].h-sh.people[a].h}).forEach(function(i){
  var p=sh.people[i],s=st[p.name],mx=Math.min(7,Math.floor(MAX/p.h)),emp=[],d;
  if(!s||!s.n){if(p.name)skip.push(p.name);return}
  function cell(d){return sh.cells[i+'-'+d]||''}
  function setR(d,v){sh.cells[i+'-'+d]=v;cnt[d]++;emp.splice(emp.indexOf(d),1);f++}
  function bd(l){var b=l[0],m=1e9;l.forEach(function(d){var c=cnt[d]*10-s.rw[wd(sh.ym,d)]/Math.max(1,s.r0)*5+((sti(cell(d-1))>-1)+(sti(cell(d+1))>-1))*4;if(c<m){m=c;b=d}});return b}
  for(d=1;d<=n;d++)if(!cell(d))emp.push(d);
  var wm={};for(d=1;d<=n;d++){var l=wlab(sh.ym,d);(wm[l]=wm[l]||[]).push(d)}
  Object.keys(wm).forEach(function(l){var ds=wm[l],need=Math.max(0,ds.length-mx)-ds.filter(function(x){return sti(cell(x))>-1}).length;
   while(need-->0){var c=ds.filter(function(x){return !cell(x)});if(!c.length)break;setR(bd(c),'휴무')}});
  var t0=Math.round(s.r0/s.n*n),t2=Math.round(s.r2/s.n*n),c0=0,c2=0;
  for(d=1;d<=n;d++){var k=sti(cell(d));if(k===0)c0++;if(k===2)c2++}
  while(c0<t0&&emp.length){setR(bd(emp),'휴무');c0++}
  while(c2<t2&&emp.length){setR(bd(emp),'비번');c2++}
  var W=emp.length,bs=Object.keys(s.wk),tot=0,tg={},rm=[],sm=0,as={};
  bs.forEach(function(b){tot+=s.wk[b]});if(!W||!tot)return;
  bs.forEach(function(b){var x=s.wk[b]/tot*W;tg[b]=Math.floor(x);sm+=tg[b];rm.push([x-tg[b],b]);as[b]=0});
  rm.sort(function(a,b){return b[0]-a[0]});for(var q=0;sm<W;q++,sm++)tg[rm[q%rm.length][1]]++;
  emp.slice().forEach(function(d,t){var w=wd(sh.ym,d),best=null,bx=-1e9;
   bs.forEach(function(b){if(as[b]>=tg[b])return;var sc=tg[b]*(t+1)/W-as[b]+s.wa[b][w]/s.wk[b];if(sc>bx){bx=sc;best=b}});
